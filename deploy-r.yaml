apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tom
  name: tom
spec:
  replicas: 10
  selector:
    matchLabels:
      app: tom
  template:
    metadata:
      labels:
        app: tom
    spec:
      containers:
      - image: httpd:alpine3.18
        name: httpd
  strategy:
    type: Recreate
